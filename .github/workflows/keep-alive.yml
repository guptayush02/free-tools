name: Keep Server Awake

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch:

jobs:
  ping-health-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          TARGET_URL="${KEEP_ALIVE_URL:-https://free-tools-xm13.onrender.com/api/health/ping}"
          echo "Pinging ${TARGET_URL}"
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            --write-out "%{http_code}" \
            --output /dev/null \
            "$TARGET_URL")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "Keep-alive ping failed with status ${HTTP_CODE}"
            exit 1
          fi